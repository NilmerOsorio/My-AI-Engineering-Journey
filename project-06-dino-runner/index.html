<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Pixel Art Dino Runner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="hud">
            <div class="score">SCORE: <span id="score">0</span></div>
            <div class="high-score">HIGH: <span id="highScore">0</span></div>
        </div>

        <canvas id="gameCanvas" width="800" height="400" aria-label="Dino Runner Game"></canvas>

        <div id="startScreen" class="overlay">
            <div class="overlay-card">
                <h1>DINO RUNNER</h1>
                <p>Press SPACE / UP / TAP to jump</p>
                <button id="startBtn">START GAME</button>
            </div>
        </div>

        <div id="gameOverScreen" class="overlay hidden">
            <div class="overlay-card">
                <h1>GAME OVER</h1>
                <p>Your Score: <span id="finalScore">0</span></p>
                <p>High Score: <span id="finalHighScore">0</span></p>
                <button id="restartBtn">RESTART</button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
